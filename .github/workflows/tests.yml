name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # The pinned stack sets the actual floor: pandas 3.0.5 requires 3.11+
      # and numpy 2.5.1 requires 3.12+. Test every supported minor rather than
      # adding jobs that can never finish dependency installation.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    name: tests (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest tests/ -v
