name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # README claims 3.10+; CI proved only 3.12, so a 3.10-only syntax or
      # stdlib regression could ship undetected against the stated support
      # range. `fail-fast: false` so one version's failure still reports the
      # others -- knowing whether a break is version-specific or universal is
      # most of the diagnosis.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
      # NOTE: this project's own code uses no 3.11+ stdlib features (checked),
      # but requirements.txt pins recent pandas/numpy/streamlit whose Python
      # floors were NOT verifiable offline. If 3.10 fails on dependency
      # resolution rather than on our tests, the honest fix is to correct
      # README's "Python 3.10 or newer" claim to the real floor -- not to
      # downgrade the pins.
    name: tests (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest tests/ -v
