# Counter-review IPRCR-002 (2026-08-12). `artifacts/` is fully gitignored,
# machine-local state -- and review worktrees have been placed there
# (`artifacts/codex-independent-full-review`, per the 2026-08-12 independent
# review handoff). pytest does not honor .gitignore, so a worktree there gives
# every test module a same-basename twin and the repository-prescribed
# `python -m pytest -q` dies with one "import file mismatch" collection error
# per test file (163 observed) while reporting zero tests run.
#
# The first nine entries are pytest 9.1's own defaults, restated because
# setting the option REPLACES the default list rather than extending it;
# `artifacts` is the only addition. tests/test_module_hygiene.py pins this.
[pytest]
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} artifacts
